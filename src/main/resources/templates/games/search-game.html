<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head th:replace="fragments :: head"></head>

<body class="container">

<nav th:replace="fragments :: navigation-admin"></nav>

<h3>Search Games</h3>

<form method="post" th:action="@{/games/search-game}">
    <div class="form-group">
        <label for="searchTerm">Search by Game Name:</label>
        <div class="input-group">
            <input type="text" class="form-control" id="searchTerm" name="searchTerm"
                   th:value="${searchTerm}" placeholder="Enter game name..." />
            <span class="input-group-btn">
                <button type="submit" class="btn btn-primary">
                    <span class="glyphicon glyphicon-search"></span> Search
                </button>
            </span>
        </div>
    </div>
</form>

<div th:if="${searchTerm != null && games != null}">
    <h4>Search Results for "<span th:text="${searchTerm}"></span>"</h4>

    <div th:if="${#lists.isEmpty(games)}">
        <p class="text-warning">No games found matching your search.</p>
    </div>

    <table th:if="${!#lists.isEmpty(games)}" class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Platform</th>
                <th>Developer</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="game : ${games}">
                <td th:text="${game.name}"></td>
                <td th:text="'$' + ${game.price}"></td>
                <td th:text="${game.platforms != null ? game.platforms.name : 'N/A'}"></td>
                <td th:text="${game.developers != null ? game.developers.name : 'N/A'}"></td>
                <td>
                    <a th:href="@{/games/view-game/(id=${game.id})}" class="btn btn-sm btn-info">
                        <span class="glyphicon glyphicon-eye-open"></span> View
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
